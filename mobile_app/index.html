<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102b3f">
    <meta name="description" content="Мобильный кабинет секретаря Учёного совета">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>Совет · АРМ секретаря</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="На главную">
          <span class="brand-mark" aria-hidden="true">У</span>
          <span><strong>Учёный совет</strong><small>мобильный кабинет</small></span>
        </a>
        <span class="connection" id="connection"><i></i><span>Проверяем связь</span></span>
      </header>

      <main id="screen" class="screen" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Разделы приложения">
        <button class="nav-item active" data-screen="home"><span class="nav-icon">⌂</span><span>Обзор</span></button>
        <button class="nav-item" data-screen="councils"><span class="nav-icon">♙</span><span>Советы</span></button>
        <button class="nav-item" data-screen="candidates"><span class="nav-icon">◎</span><span>Соискатели</span></button>
        <button class="nav-item" data-screen="dissertations"><span class="nav-icon">▤</span><span>Дела</span></button>
        <button class="nav-item" data-screen="meetings"><span class="nav-icon">▦</span><span>Заседания</span></button>
      </nav>
    </div>

    <dialog id="dialog" class="dialog">
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
