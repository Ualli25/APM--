name: Tests and static security checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and lab 8 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-lab8.txt
      - name: Run automated tests
        run: pytest -v
      - name: Run Bandit static analysis
        run: bandit -r app -ll
