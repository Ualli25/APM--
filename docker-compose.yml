services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/database.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - database_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  database_data:
