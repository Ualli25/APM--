{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Вход в систему</h1>
  <p class="sub" style="margin-bottom:22px">АРМ Секретаря Учёного совета</p>
  <form method="post">
    <div class="field"><label for="login">Логин</label><input id="login" name="login" autofocus required></div>
    <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required></div>
    <button class="btn primary" type="submit" style="width:100%">Войти</button>
  </form>
  <div class="demo">
    <b>Демо-доступ:</b><br>
    Секретарь — <code>secretary</code> / <code>secretary123</code> (полный доступ)<br>
    Член совета — <code>member</code> / <code>member123</code> (только просмотр)<br>
    Администратор — <code>admin</code> / <code>admin123</code>
  </div>
</div>
{% endblock %}
